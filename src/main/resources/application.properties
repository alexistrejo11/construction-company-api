spring.application.name=${SPRING_APPLICATION_NAME:construction-company-api}

# Activa 'dev' por defecto si no se pasa otra variable de entorno
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Mail configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Server port
server.port=8080

# file upload directory
file.upload.dir=${FILE_UPLOAD_DIR:./uploads}
file.upload.max-size-bytes=${FILE_UPLOAD_MAX_SIZE_BYTES:10485760}
file.upload.allowed-content-types=${FILE_UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,application/pdf}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring MVC settings
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Optional import of environment-specific properties
spring.config.import=optional:file:.env[.properties]
spring.session.timeout=24h
spring.session.jdbc.initialize-schema=always
