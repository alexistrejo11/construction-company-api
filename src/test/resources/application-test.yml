spring:
  application:
    name: company-expenses-api-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
    url: jdbc:h2:mem:testdb
    user: sa
    password:
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000
  ai:
    model:
      embedding:
        enabled: false

JWT_SECRET_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt:
  expiration:
    ms: 86400000

file:
  upload:
    dir: ${java.io.tmpdir}/company-expenses-test-uploads

app:
  rate-limit:
    capacity: 1000
    refill-tokens: 1000
    refill-minutes: 1
